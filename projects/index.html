<script src="../projects.js"></script>
<script>
  const projectList = document.getElementById('project-list');
  // the thumbs are painted as masks; their SVGs were recolored in place (same
  // filenames), so browsers holding the pre-recolor copy under GitHub Pages'
  // max-age=600 mask the full old white rect until it expires. Bump THUMB_VER
  // whenever a thumb SVG changes to force a fresh fetch (new URL = cache miss).
  const THUMB_VER = '2';
  for (const p of (window.PROJECTS || [])) {
    const li = document.createElement('li');

    const thumbLink = document.createElement('a');
    thumbLink.className = 'project-thumb';
    thumbLink.href = p.url || '#';
    thumbLink.setAttribute('aria-hidden', 'true');
    thumbLink.tabIndex = -1;
    const thumbFill = document.createElement('span');
    thumbFill.className = 'thumb-fill';
    if (p.thumb) {
      const sep = p.thumb.indexOf('?') === -1 ? '?' : '&';
      thumbFill.style.setProperty('--thumb-src', 'url("' + p.thumb + sep + 'v=' + THUMB_VER + '")');
    }
    thumbLink.appendChild(thumbFill);
    li.appendChild(thumbLink);

    const text = document.createElement('div');
    text.className = 'project-meta';
    const top = document.createElement('div');
    top.className = 'project-meta-top';
    const year = document.createElement('span');
    year.className = 'year';
    year.textContent = p.year || '';
    top.appendChild(year);
    const a = document.createElement('a');
    a.href = p.url || '#';
    a.textContent = p.name;
    top.appendChild(a);
    text.appendChild(top);
    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = p.description || '';
    text.appendChild(desc);
    li.appendChild(text);

    projectList.appendChild(li);
  }
</script>
